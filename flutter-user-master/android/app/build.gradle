plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// Ключ Yandex MapKit подставляется в манифест. Значение по умолчанию оставлено,
// чтобы сборка не ломалась, но оно уже утекло в git-историю и требует ротации.
def yandexMapsKeyValue = localProperties.getProperty("yandex.mapsApiKey")
if (yandexMapsKeyValue == null) {
    yandexMapsKeyValue = "d91bb4f0-deaa-4b35-8764-1e08e6b8a38b"
}

// Подпись релиза. key.properties держим вне git (см. android/.gitignore).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace = "uz.md.taxi_user"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "uz.md.taxi_user"
        minSdk = 26
        // Google Play требует targetSdk 35.
        targetSdk = 35
        versionCode = 1
        versionName = '1.0.0'
        multiDexEnabled = true
        manifestPlaceholders += [yandexMapsApiKey: yandexMapsKeyValue]
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Раньше здесь стоял signingConfigs.debug: релиз подписывался
            // публично известным debug-ключом и не принимался Play.
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("WARNING: android/key.properties не найден — release собирается debug-ключом и НЕ пригоден для публикации.")
                signingConfig signingConfigs.debug
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation platform('com.google.firebase:firebase-bom:30.3.2')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.yandex.android:maps.mobile:4.6.1-full'
}
