# Статический анализ проекта.
#   flutter analyze
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Каждое правило ниже соответствует багу, который уже был найден в этом
    # коде. Поднято до error, чтобы такое не проходило ревью повторно.
    #
    # `bearerToken.clear;` — tear-off вместо вызова, токены не очищались.
    unnecessary_statements: error
    # `connectivityResult == ConnectivityResult.none` при List слева и
    # `PermissionStatus == LocationPermission` — сравнения всегда false.
    unrelated_type_equality_checks: error
    # print() не вырезается в release, а в него утекали токены.
    avoid_print: error
    # Навигация и обращение к context после await без проверки mounted.
    use_build_context_synchronously: warning

linter:
  rules:
    - unnecessary_statements
    - avoid_empty_else
